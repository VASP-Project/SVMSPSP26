<div class="content">
    <div class="card">
        <div class="col-md-12">
            <h3 class="card-title">Inspection Type</h3>
            <div *ngIf="!view">
                <form #formData="ngForm" (ngSubmit)="onSubmit(formData)">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <input type="hidden" id="id" [(ngModel)]="inspectiontype.id" name="id" #id="ngModel">
                                <label>Inspection Category </label>
                                <!-- <select id="inspectionType" #Id="ngModel" class="form-control" 
                              [(ngModel)]="inspectiontype.inspectionType" name="inspectionType" required>                                        
                                        <option disabled selected value="0">Select Inspection Type</option>                               
                                        <option>Perimeter Inspection</option>
                                        <option>Portal Inspection</option>
                                        <option>Facility Inspection</option>
                                        <option>Delivery-Vehicle Inspection</option>
                                        <option>Sterile Area PI Inspection</option>
                                        <option>Other</option>
                                </select>                                                            -->
                                <!-- <input type="text" class="form-control" id="inspectionType" required
                                  [(ngModel)]="inspectiontype.inspectionType" name="inspectionType" #inspectionType="ngModel">  -->

                                <ng-select appendTo="body" id="inspectionType" #select [items]="inspectionTypeNames"
                                    bindLabel="typeName" placeholder="Select Inspection Type" bindValue="typeName"
                                    [(ngModel)]="inspectiontype.inspectionType" appearance="outline" (change)="onTypeChange(inspectiontype.inspectionType)"
                                    name="inspectionType" required>
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <label>Inspection Type </label>
                            <input type="text" class="form-control" id="displayName" required
                                [(ngModel)]="inspectiontype.displayName" name="displayName" #displayName="ngModel" autocomplete="off">
                        </div>
                    </div>
                    
                    <div class="form-group" style="margin-top: 5px;">
                        <button type="submit" class="btn btn-success" [disabled]="!formData.form.valid">Save</button>
                        <button type="button" (click)="hideaddform()" class=" btn btn-fill btn-danger"
                            style="margin-left: 2px;">Close</button>
                    </div>
                </form>
            </div>

            <div *ngIf="view">
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group">
                            <input type="hidden" id="id" [(ngModel)]="inspectiontype.id" name="id" #id="ngModel">
                            <strong>Inspection Category : </strong>
                            <label>{{inspectiontype.inspectionType}}</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group">
                            <strong>Inspection Type : </strong>
                            <label>{{inspectiontype.displayName}}</label>
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 5px;">
                    <button type="button" (click)="hideaddform()" class=" btn btn-fill btn-danger">Close</button>
                </div>
            </div>
        </div>
    </div>
</div>
