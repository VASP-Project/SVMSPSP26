<div class=" content">
        <div class=" row">
            <div class=" col-md-12">
                <div class=" card" >
                    <!-- <br> -->
                    <div class="col-md-12">
                        <h3 class=" card-title">Violation Types</h3>
                    </div>
                    <div *ngIf="!view">
                        <form #formData="ngForm" (ngSubmit)="onSubmit(formData)">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <input type="hidden" id="id" [(ngModel)]="violation.id" name="id" #id="ngModel">
                                        <label>Violation Type</label>
                                        <input type="text" class="form-control" id="violationType" required
                                            [(ngModel)]="violation.violationType" name="violationType"
                                            #violationType="ngModel">                                       
                                    </div>
                                </div>
                            </div>
                            <div class="form-group" style="margin-top: 5px;">
                                <button type="submit" class="btn btn-success" [disabled]="!formData.form.valid">Save</button>
                                <button type="button" (click)="hideaddform()" style="margin-left: 2px; "
                                class=" btn btn-fill btn-danger">Close</button>
                            </div>
                        </form>
    
                    </div>
    
                    <div *ngIf="view">
    
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <input type="hidden" id="id" [(ngModel)]="violation.id" name="id" #id="ngModel">
                                    <strong>Violation Type: </strong>
                                    <label>{{violation.violationType}}</label>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <button type="button" (click)="hideaddform()" style="margin-top: 5px; "
                            class=" btn btn-fill btn-danger">Close</button>
                        </div>
    
    
                    </div>
    
                </div>
            </div>
    
        </div>
    </div>
