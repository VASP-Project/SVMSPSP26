<div class="content">
    <div class="card">
        <div class="col-md-12">
            <h3 class="card-title">Inspection Category</h3>
            <div *ngIf="!view" >
                <form #formData="ngForm"  (ngSubmit)="onSubmit(formData)">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <input type="hidden" id="id" [(ngModel)]="inspectiontypeMaster.id" name="id" #id="ngModel">
                                <label>Inspection Category Name </label>
                               <input type="text" class="form-control" id="typeName" required [(ngModel)] ="inspectiontypeMaster.typeName"
                               name = "typeName" #typeName="ngModel" >                                
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <label>Required </label>
                            <input type="text" class="form-control" id="requiredHours" required 
                             [(ngModel)]="inspectiontypeMaster.requiredHours" OnlynumberDirective="true" name="requiredHours" #requiredHours="ngModel" autocomplete="off">
                        </div>
                    </div>
                    

                    <div class="form-group" style="margin-top: 5px;">
                        <button type="submit" class="btn btn-success" [disabled]="!formData.form.valid">Save</button>
                        <button type="button" (click)="hideaddform()" class=" btn btn-fill btn-danger"
                            style="margin-left: 2px;">Close</button>
                    </div>
                </form>
            </div>

            <div *ngIf="view">
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group">
                            <input type="hidden" id="id" [(ngModel)]="inspectiontypeMaster.id" name="id" #id="ngModel">
                            <strong>Inspection Category : </strong>
                            <label>{{inspectiontypeMaster.typeName}}</label>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group">
                            <strong>Required : </strong>
                            <label>{{inspectiontypeMaster.requiredHours}}</label>
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 5px;">
                    <button type="button" (click)="hideaddform()" class=" btn btn-fill btn-danger">Close</button>
                </div>
            </div>
        </div>
    </div>
</div>
