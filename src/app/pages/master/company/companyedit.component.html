<div class="content">
    <div class="card">
        <div class="col-md-12">
            <h3 class="card-title">Company</h3>
            <div *ngIf="!view">
                <form #formData="ngForm" (ngSubmit)="onSubmit(formData)">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <input type="hidden" id="id" [(ngModel)]="company.id" name="id" #id="ngModel">
                                <label>Name </label>
                                <input type="text" class="form-control" id="companyName" required
                                    [(ngModel)]="company.companyName" name="companyName" #companyName="ngModel">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Company Logo</label> &nbsp;
                                <input #file type="file" accept='image/*' (change)="preview(file.files)" />
                                <!-- <span class="btn btn-success">
                                    <i class="tim-icons icon-pin"></i> Upload Icon</span> -->
                                <br>

                            </div>
                        </div>
                         <div class="col-md-6">
                            <div class="form-group">
                                <label for="checkbox">Concessionaire  Company</label>
                                <div class="form-check" style="margin-left: 10px">
                                    <label class="form-check-label">
                                     
                                        <input class="form-check-input checkbox-size" type="checkbox"
                                            [(ngModel)]="company.isConcessionaire" [ngModelOptions]="{ standalone: true }"
                                            (ngModelChange)="checkBoxChange($event)" style="font-size: 20px" />
                                        &nbsp;
                                        <span class="form-check-sign">
                                            <span class="check"> </span>
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <img [src]="imgURL" height="200" *ngIf="imgURL" (click)="openImage(imgURL)">
                            <div *ngIf="message" class="alert alert-danger">{{message}}</div>
                        </div>
                       
                    </div>
                    <div class="form-group" style="margin-top: 5px;">
                        <button type="submit" class="btn btn-success" [disabled]="!formData.form.valid">Save</button>
                        <button type="button" (click)="hideaddform()" class=" btn btn-fill btn-danger"
                            style="margin-left: 2px;">Close</button>
                    </div>
                </form>
            </div>

            <div *ngIf="view">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <input type="hidden" id="id" [(ngModel)]="company.id" name="id" #id="ngModel">
                            <strong>Name: </strong>
                            <label>{{company.companyName}}</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <strong style="vertical-align: top;">Company Logo: </strong>
                            <img [src]="imgURL" height="200" *ngIf="imgURL">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <button type="button" (click)="hideaddform()" style="margin-top: 5px;"
                        class=" btn btn-fill btn-danger">Close</button>
                </div>
            </div>
        </div>
    </div>
</div>
