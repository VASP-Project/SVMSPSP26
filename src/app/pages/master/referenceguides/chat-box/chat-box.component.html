
<button class="btn btn-secondary back-button" (click)="goBack()">
    ← Back
  </button>
  
<div class="chat-container">
    <div class="chat-box" #chatBox>
      <div *ngFor="let msg of messages" [ngClass]="{'user': msg.sender === 'user', 'bot': msg.sender === 'bot'}" class="message">
        <div class="bubble">{{ msg.text }}</div>
      </div>
    </div>
  
    <form (ngSubmit)="sendMessage()" class="chat-input">
      <input type="text"  [(ngModel)]="userInput"  name="userInput" placeholder="Type a message..." required />
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-send"></i> Send
      </button>
    </form>
  </div>
