<div class="content">
<div class="row">
  <div class="col-md-12">
      <div class="row">
          <div class="col-md-12 mx-auto">
              <div class="card">
                  <!-- <br /> -->
                  <div class="col-md-6">  
                      <h3 class="card-title">Change Password</h3>
                  </div>
                  <div class="card-body">
                      <form #changeForm="ngForm" (ngSubmit)="changePasswords()">
                          <div class="row">
                              <div class="col-md-6">
                                  <div class="form-group">
                                        <label>Enter Current Password</label>
                                      <input type="password" id="password" required
                                          [(ngModel)]="ChangePasswordModel.oldPassword" maxlength="100"
                                          #oldPassword="ngModel" name="password" class="form-control">
                                  </div>
                              </div>
                          </div>
                          <div class="row">
                              <div class="col-md-6">
                                  <div class="form-group">
                                        <label>Enter New Password</label>
                                      <input type="password" id="newPassword" required
                                          [(ngModel)]="ChangePasswordModel.newPassword" maxlength="100"
                                          #newPassword="ngModel" name="newPassword"
                                          class="form-control" required
                                          ><!-- pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*_=+-]).{8,13}$" -->
                                  </div>
                                  <!-- <div [hidden]="newPassword.valid || newPassword.pristine"
                                      class="alert alert-danger">
                                      Input must contain at least one special symbol / digit / lowercase / uppercase
                                      letter and be at least 6-12 characters long
                                  </div> -->
                              </div>
                              <div class="col-md-6">
                                  <div class="form-group">
                                        <label>Re-enter New Password</label>
                                      <input type="password" id="reEnterNewPassword" required
                                          [(ngModel)]="ChangePasswordModel.reEnterNewPassword" maxlength="100"
                                          name="reEnterNewPassword" class="form-control">
                                  </div>
                              </div>
                          </div>
                          <br />
                          <div class="col-md-12 text-center">
                              <div class="form-group">
                                  <button type="submit" class="btn btn-fill btn-success"
                                      [disabled]="!changeForm.form.valid">Change Password</button>
                                  <button type="button" class="btn btn-fill btn-danger" style="margin-left: 2px;" (click)="back()">Close</button>
                              </div>
                          </div>
                      </form>
                  </div>
              </div>
          </div>
      </div>
  </div>
</div>
</div>
